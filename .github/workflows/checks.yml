name: checks
on:
  push:
    branches:
      - 'claude/**'
      - '!claude/claims'
      - '!claude/train'
      - '!claude/review-*'
    paths-ignore:
      - 'reports/**'
      - 'plan/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'reports/**'
      - 'plan/**'
      - '**/*.md'
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: npm audit --audit-level=high
      - name: gitleaks
        run: |
          # SHA-256 from gitleaks v8.28.0 gitleaks_8.28.0_checksums.txt (release assets)
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-banner --redact
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run deps:check
      - run: npm test
